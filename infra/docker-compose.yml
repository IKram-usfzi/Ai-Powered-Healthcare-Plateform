services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globalcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalcare}
      POSTGRES_DB: ${POSTGRES_DB:-globalcare}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.70.0
    restart: unless-stopped
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies:/policies

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-globalcare}:${POSTGRES_PASSWORD:-globalcare}@postgres:5432/${POSTGRES_DB:-globalcare}
      REDIS_URL: redis://redis:6379/0
      OPA_URL: http://opa:8181
      # data/synthea/ lives at the repo root, outside the backend/ build context
      # (can't be COPY'd into the image) - bind-mounted instead. See
      # backend/scripts/fetch_synthea.py.
      SYNTHEA_DATA_DIR: /data/synthea
      # Same reasoning for docs/ - scripts/train_risk_model.py writes the AI
      # evaluation report there, and docs/ is also outside the build context.
      DOCS_DIR: /docs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_started
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../data:/data
      - ../docs:/docs

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
      - ../frontend/eslint.config.js:/app/eslint.config.js

volumes:
  postgres_data:
