services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globalcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalcare}
      POSTGRES_DB: ${POSTGRES_DB:-globalcare}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-globalcare}:${POSTGRES_PASSWORD:-globalcare}@postgres:5432/${POSTGRES_DB:-globalcare}
      REDIS_URL: redis://redis:6379/0
      # data/synthea/ lives at the repo root, outside the backend/ build context
      # (can't be COPY'd into the image) - bind-mounted instead. See
      # backend/scripts/fetch_synthea.py.
      SYNTHEA_DATA_DIR: /data/synthea
      # Same reasoning for docs/ - scripts/train_risk_model.py writes the AI
      # evaluation report there, and docs/ is also outside the build context.
      DOCS_DIR: /docs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - ../data:/data
      - ../docs:/docs

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
      - ../frontend/eslint.config.js:/app/eslint.config.js

volumes:
  postgres_data:
